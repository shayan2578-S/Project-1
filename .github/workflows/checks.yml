name: Offline calculation checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      # Official-data and browser checks run after acquisition; skips are explicit.
      - run: python -m pytest tests/test_analysis.py tests/test_pipeline.py -q
